<header class="gr-header">
  <div class="gr-header__inner">
    <a class="gr-brand" href="/" aria-label="Ghulam Rasul Bazaar, home">
      <span class="gr-brand__mark">GR</span>
      <span class="gr-brand__name">
        Ghulam Rasul <em>Bazaar</em>
      </span>
    </a>

    <div class="gr-search" role="search">
      <svg class="gr-search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
        <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <input
        type="search"
        class="gr-search__input"
        placeholder="Search the bazaar — try 'copper' or 'wool'"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchInput()"
        aria-label="Search products"
      />
      @if (searchTerm) {
        <button type="button" class="gr-search__clear" (click)="clearSearch()" aria-label="Clear search">
          &times;
        </button>
      }
    </div>

    <button type="button" class="gr-cart-btn" (click)="cartToggle.emit()" aria-label="Open cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="10" cy="21" r="1.4" fill="currentColor" />
        <circle cx="18" cy="21" r="1.4" fill="currentColor" />
      </svg>
      <span>Cart</span>
      @if (itemCount() > 0) {
        <span class="gr-cart-btn__badge">{{ itemCount() }}</span>
      }
    </button>
  </div>
</header>
